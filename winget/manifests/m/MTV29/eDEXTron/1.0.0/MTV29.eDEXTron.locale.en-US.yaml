ShortDescription: A sci-fi desktop theme for Windows, inspired by eDEX-UI.
Description: |-
  eDEX-Tron brings the look of eDEX-UI, the sci-fi terminal interface by
  Gabriel "Squared" Saillard, to the whole Windows desktop while you carry on
  using Windows normally.

  A live HUD sits behind your windows with the clock, per-core CPU graphs, a
  memory map, network status and usage, the top processes, and optional disk,
  listening-port and graphics-card panels. A Command Prompt is framed as the
  main shell and kept in place. A dock holds your apps, and icon grids mirror
  your Desktop and a folder of your choosing. Windows, Windows Terminal,
  VS Code and Office are darkened to one accent colour you can change from a
  settings window or a single command.

  The layout is worked out from your resolution and scaling rather than
  hard-coded, and re-planned by itself when the screen changes. Everything it
  changes is backed up first and reverted by its uninstaller.

  An independent fan project, not affiliated with or endorsed by eDEX-UI.
